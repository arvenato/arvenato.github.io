<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sabit üst bar + sekmeler; içerik tek sütun, özet kartları ızgarada, defter tablosu yatay kaydırmalı */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --line:#d3dbd8;
  --fg:#16211d; --muted:#5b6b65;
  --accent:#17624d; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --in:#13724f; --out:#b23a2e; --warn:#9a6a00; --warn-soft:#fbf0d3;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2a26; --line:#2c3a35;
  --fg:#e5ece9; --muted:#93a59e;
  --accent:#5cc7a2; --accent-ink:#06261b; --accent-soft:#1d3a30;
  --in:#5cc7a2; --out:#f08a7e; --warn:#e6bb57; --warn-soft:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2a26; --line:#2c3a35;
  --fg:#e5ece9; --muted:#93a59e;
  --accent:#5cc7a2; --accent-ink:#06261b; --accent-soft:#1d3a30;
  --in:#5cc7a2; --out:#f08a7e; --warn:#e6bb57; --warn-soft:#3a3018; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-family:var(--font-display);font-size:1.35rem;margin:0;line-height:1.15;letter-spacing:-.01em}
.brand .firma{color:var(--muted);font-size:.85rem;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:.85rem}
.brand .firma:hover{color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;font-weight:600;font-size:.9rem}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.danger{color:var(--out)}
.ghost{background:transparent;border-color:transparent}
.small{padding:5px 10px;font-size:.82rem}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.88rem}
.notice b{color:var(--warn)}
h2{font-family:var(--font-display);font-size:1.15rem;margin:0;text-wrap:balance}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--font-num);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.pos{color:var(--in)} .neg{color:var(--out)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.date{font-family:var(--font-num);white-space:nowrap;color:var(--muted)}
tfoot td{font-weight:700;border-bottom:0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.chip.satis,.chip.tahsilat{background:var(--accent-soft);color:var(--in)}
.chip.alis,.chip.gider,.chip.odeme{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.chip.ornek{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
/* modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);color:var(--fg);border-radius:12px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:9px}
.types button{border:0;background:transparent;padding:7px 4px;font-size:.82rem}
.types button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px color-mix(in srgb,#000 15%,transparent)}
@media (max-width:460px){.types{grid-template-columns:repeat(3,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.calc{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--font-num);font-size:.88rem}
.calc b{font-size:1rem}
.err{color:var(--out);font-size:.85rem}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:30}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.kanal-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem}
.kanal-row .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.aj-takvim{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:4px;min-width:620px}
.aj-bas{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 6px}
.aj-gun{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:86px;padding:6px;text-align:left;font-weight:400;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.aj-gun.bugun{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.aj-gun.secili{background:var(--accent-soft)}
.aj-no{font-family:var(--font-num);font-size:.8rem;font-weight:600}
.aj-etk{display:block;font-size:.7rem;line-height:1.25;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);color:var(--fg)}
.aj-etk.o{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.aj-etk.t{background:var(--accent-soft);color:var(--in)}
.aj-etk.h{background:var(--warn-soft);color:var(--warn)}
.aj-etk.bitti{opacity:.5;text-decoration:line-through}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}

html,body{margin:0}
body{font-size:14px;font-family:var(--font-body)}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.kapali header.top,body.kapali .wrap>main{display:none}
#kapi{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.kapi-kart{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.kapi-logo{display:flex;gap:12px;align-items:center}
.kapi-logo img{border-radius:10px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:1.1rem}.top-row{padding-block:10px}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>Ön Muhasebe</h1>
        <button class="firma" id="firmaBtn" type="button">Firma adını girin</button>
      </div>
      <button class="ghost small" id="yedekBtn" type="button" title="Tüm kayıtları JSON dosyası olarak indir">Yedek al</button>
      <button class="ghost small" id="hesapBtn" type="button" title="Hesabım, kullanıcılar, yedek">Hesabım</button>
      <button class="primary" id="newBtn" type="button">+ Yeni kayıt</button>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#gelirler">Gelirler</a>
      <a href="#giderler">Giderler</a>
      <a href="#cariler">Cariler</a>
      <a href="#bankalar">Bankalar</a>
      <a href="#stok">Stok</a>
      <a href="#teklifler">Teklifler</a>
      <a href="#personeller">Personeller</a>
      <a href="#hareketler">Hareketler</a>
      <a href="#ozet">Özet</a>
      <a href="#rapor">Aylık rapor</a>
      <a href="#faturalar">Faturalar</a>
      <a href="#ajanda">Ajanda</a>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>
<div id="kapi" hidden></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const TYPES={
  satis:{ad:"Satış",yon:+1,kdvli:true},
  alis:{ad:"Alış",yon:-1,kdvli:true},
  gider:{ad:"Gider",yon:-1,kdvli:true},
  tahsilat:{ad:"Tahsilat",yon:+1,kdvli:false},
  odeme:{ad:"Ödeme",yon:-1,kdvli:false}
};
const KANALLAR=["Mağaza","Trendyol","Hepsiburada","n11","Pazarama","Amazon","Web sitesi","Diğer"];
const GIDER_KAT=["Kargo","Pazaryeri komisyonu","Reklam","Kira","Personel","Elektrik / su / internet","Yakıt","Mutfak","Muhasebe","Ofis malzemesi","Vergi / SGK","Diğer"];
const KDV_ORAN=[20,10,1,0];
const ODEME={acik:"Açık hesap",kasa:"Kasa (nakit)",banka:"Banka / POS",mahsup:"Maaştan mahsup"};

const state={cariler:[],hareketler:[],personeller:[],ekler:[],izinler:[],bankalar:[],virmanlar:[],urunler:[],stokHareketleri:[],teklifler:[],faturalar:[],ajanda:[],firma:"",mode:"loading",readonly:false,stale:false,error:""};
let api=null; // {setDoc(col,id,obj), del(col,id), newId(col), setFirma(name)}
let downloads=null;

const fmt=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:2});
const money=n=>fmt.format(Math.round((n||0)*100)/100);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ym=s=>(s||"").slice(0,7);
const trDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y};
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cariById=id=>state.cariler.find(c=>c.id===id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- Hesaplamalar ---------- */
function kasaBanka(){
  const r={kasa:0,banka:0};
  for(const h of state.hareketler){
    if(h.odeme==="kasa"||h.odeme==="banka"){r[h.odeme]+=TYPES[h.tur].yon*(h.toplam||0)}
  }
  for(const b of state.bankalar)r.banka+=Number(b.acilis)||0;
  for(const v of state.virmanlar){const t=Number(v.tutar)||0;if(v.kaynak==="kasa")r.kasa-=t;else r.banka-=t;if(v.hedef==="kasa")r.kasa+=t;else r.banka+=t}
  r.kasa=r2(r.kasa);r.banka=r2(r.banka);return r;
}
function varsayilanBanka(){return state.bankalar.find(b=>b.varsayilan)||state.bankalar.slice().sort((a,b)=>(a.olusturma||0)-(b.olusturma||0))[0]||null}
function hBankaId(h){if(h.bankaId&&state.bankalar.some(b=>b.id===h.bankaId))return h.bankaId;const v=varsayilanBanka();return v?v.id:""}
function bankaAd(id){const b=state.bankalar.find(x=>x.id===id);return b?(b.ad+(b.hesapAdi?" · "+b.hesapAdi:"")):""}
function odemeAd(h){if(h.odeme==="banka"&&state.bankalar.length)return bankaAd(hBankaId(h))||ODEME.banka;return ODEME[h.odeme]||""}
function bankaHareketleri(bid){
  const out=[];
  for(const h of state.hareketler){if(h.odeme==="banka"&&hBankaId(h)===bid){const t=TYPES[h.tur];const c=cariById(h.cariId);out.push({tarih:h.tarih,olusturma:h.olusturma||0,aciklama:[t.ad,c&&c.ad,h.kanal&&h.tur==="satis"?h.kanal:"",h.kategori&&h.tur==="gider"?h.kategori:"",h.aciklama].filter(Boolean).join(" · "),tutar:t.yon*(h.toplam||0)})}}
  for(const v of state.virmanlar){const t=Number(v.tutar)||0;const ad=x=>x==="kasa"?"Kasa":bankaAd(x)||"Silinmiş hesap";
    if(v.kaynak===bid)out.push({tarih:v.tarih,olusturma:v.olusturma||0,aciklama:"Virman → "+ad(v.hedef)+(v.aciklama?" · "+v.aciklama:""),tutar:-t,virmanId:v.id});
    if(v.hedef===bid)out.push({tarih:v.tarih,olusturma:v.olusturma||0,aciklama:"Virman ← "+ad(v.kaynak)+(v.aciklama?" · "+v.aciklama:""),tutar:t,virmanId:v.id})}
  return out.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"")||a.olusturma-b.olusturma);
}
function bankaBakiye(b){return r2((Number(b.acilis)||0)+bankaHareketleri(b.id).reduce((s,x)=>s+x.tutar,0))}
// pozitif = cari bize borçlu (alacağımız), negatif = biz cariye borçluyuz
function cariBakiye(id){
  let b=0;
  for(const h of state.hareketler){
    if(h.cariId!==id)continue;
    const t=h.toplam||0;
    if(h.tur==="satis"&&h.odeme==="acik")b+=t;
    else if(h.tur==="tahsilat")b-=t;
    else if((h.tur==="alis"||h.tur==="gider")&&h.odeme==="acik")b-=t;
    else if(h.tur==="odeme")b+=t;
  }
  return r2(b);
}
function donemOzet(filter){
  const o={satisNet:0,satisKdv:0,alisNet:0,alisKdv:0,giderNet:0,giderKdv:0,tahsilat:0,odeme:0,adet:0};
  for(const h of state.hareketler){
    if(!filter(h))continue;o.adet++;
    if(h.tur==="satis"){o.satisNet+=h.net||0;o.satisKdv+=h.kdv||0}
    else if(h.tur==="alis"){o.alisNet+=h.net||0;o.alisKdv+=h.kdv||0}
    else if(h.tur==="gider"){o.giderNet+=h.net||0;o.giderKdv+=h.kdv||0}
    else if(h.tur==="tahsilat")o.tahsilat+=h.toplam||0;
    else if(h.tur==="odeme")o.odeme+=h.toplam||0;
  }
  o.kar=o.satisNet-o.alisNet-o.giderNet;
  o.kdvFark=o.satisKdv-o.alisKdv-o.giderKdv;
  return o;
}

/* ---------- Görünümler ---------- */
const VIEWS=["ozet","hareketler","gelirler","giderler","stok","teklifler","bankalar","cariler","personeller","rapor","faturalar","ajanda"];
let view="ozet";
const ui={tur:"",ay:"",ara:"",cariTur:"",gAy:ym(today()),gKat:"",lAy:ym(today()),lKanal:"",lOdeme:"",sAra:"",sKat:"",sDurum:"",tDurum:"",fTur:"",fDurum:"",fAy:"",ajGor:"liste",ajAy:ym(today()),ajGun:"",pDurum:"aktif",raporYil:new Date().getFullYear(),raporAy:ym(today())};

function setView(){
  const h=(location.hash||"").replace("#","");
  view=VIEWS.includes(h)?h:"ozet";
  document.querySelectorAll("#tabs a").forEach(a=>{
    if(a.getAttribute("href")==="#"+view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  render();
}
window.addEventListener("hashchange",setView);

function notices(){
  let s="";
  if(state.mode==="local")s+=`<div class="notice"><b>Yerel mod:</b> Kayıtlar şu an yalnızca bu tarayıcıda saklanıyor. Sayfayı claude.ai üzerinden açtığınızda kayıtlar hesabınızda kalıcı olarak tutulur.</div>`;
  if(state.readonly)s+=`<div class="notice"><b>Salt okunur:</b> Bu sayfada kayıt ekleme yetkiniz yok. Sahibinden “Katkıda bulunan” erişimi isteyebilirsiniz.</div>`;
  if(state.stale)s+=`<div class="notice"><b>Bağlantı bekleniyor:</b> Kayıtlara henüz ulaşılamadı, gösterilenler güncel olmayabilir.</div>`;
  if(state.error)s+=`<div class="notice"><b>Hata:</b> ${esc(state.error)}</div>`;
  if(state.hareketler.some(h=>h.ornek)||state.cariler.some(c=>c.ornek)||state.personeller.some(p=>p.ornek))
    s+=`<div class="notice" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><span><b>Örnek kayıtlar:</b> Programı tanımanız için birkaç örnek kayıt eklendi. Kendi kayıtlarınıza başlamadan silebilirsiniz.</span>${state.readonly?"":`<button class="small" data-act="ornekSil" type="button">Örnekleri sil</button>`}</div>`;
  return s;
}

function render(){
  const m=document.getElementById("main");
  document.getElementById("firmaBtn").textContent=state.firma||"Firma adını girin";
  document.getElementById("newBtn").hidden=state.readonly;
  if(state.mode==="loading"){m.innerHTML=`<div class="empty">Kayıtlar yükleniyor…</div>`;return}
  let html=notices();
  if(view==="ozet")html+=vOzet();
  else if(view==="hareketler")html+=vHareketler();
  else if(view==="cariler")html+=vCariler();
  else if(view==="giderler")html+=vGiderler();
  else if(view==="gelirler")html+=vGelirler();
  else if(view==="personeller")html+=vPersoneller();
  else if(view==="bankalar")html+=vBankalar();
  else if(view==="stok")html+=vStok();
  else if(view==="teklifler")html+=vTeklifler();
  else if(view==="faturalar")html+=vFaturalar();
  else if(view==="ajanda")html+=vAjanda();
  else html+=vRapor();
  m.innerHTML=html;
  const f=m.querySelectorAll("[data-filter]");
  f.forEach(el=>el.addEventListener("input",()=>{ui[el.dataset.filter]=el.value;rerenderKeepFocus(el.id)}));
}
function rerenderKeepFocus(id){
  const el=document.getElementById(id);const pos=el&&el.selectionStart;
  render();
  const n=document.getElementById(id);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}
}

function vOzet(){
  const kb=kasaBanka();
  const buAy=ym(today());
  const o=donemOzet(h=>ym(h.tarih)===buAy);
  let alacak=0,borc=0;
  for(const c of state.cariler){const b=cariBakiye(c.id);if(b>0)alacak+=b;else borc-=b}
  const son=[...state.hareketler].sort(sortH).slice(0,8);

  const kanal={};
  state.hareketler.filter(h=>h.tur==="satis"&&ym(h.tarih)===buAy).forEach(h=>{const k=h.kanal||"Diğer";kanal[k]=(kanal[k]||0)+(h.net||0)});

  <section class="kpis">
    ${kpi("Kasa",money(kb.kasa),"Nakit bakiye",kb.kasa<0)}
    ${kpi("Banka",money(kb.banka),state.bankalar.length?state.bankalar.length+" banka hesabı":"Hesap ve POS bakiyesi",kb.banka<0)}
    ${kpi("Alacaklar",money(alacak),"Carilerin size borcu")}
    ${kpi("Borçlar",money(borc),"Carilere borcunuz")}
  </section>
  <section class="section-head"><h2>${ayAd} ${new Date().getFullYear()}</h2><span class="muted" style="font-size:.85rem">${o.adet} kayıt</span></section>
  <section class="kpis">
    ${kpi("Satış (KDV hariç)",money(o.satisNet),"Hesaplanan KDV "+money(o.satisKdv))}
    ${kpi("Alış + gider (KDV hariç)",money(o.alisNet+o.giderNet),"İndirilecek KDV "+money(o.alisKdv+o.giderKdv))}
    ${kpi("Brüt kâr",money(o.kar),"Satış − alış − gider",o.kar<0,o.kar>0)}
    ${kpi(o.kdvFark>=0?"Ödenecek KDV":"Devreden KDV",money(Math.abs(o.kdvFark)),"Tahmini, beyanname öncesi kontrol edin")}
  </section>
  <div class="two">
    <section class="panel">
      <div class="section-head"><h2>Son hareketler</h2><a href="#hareketler" class="muted" style="font-size:.85rem">Tümünü gör</a></div>
      ${son.length?tabloH(son,false):emptyH()}
    </section>
    <section class="panel">
      <h2>Bu ay satış kanalları</h2>
      ${kl.length?kl.map(([k,v])=>`<div class="kanal-row"><span>${esc(k)}</span><div class="bar"><span style="width:${kmax?Math.max(3,v/kmax*100):0}%"></span></div><span class="num">${money(v)}</span></div>`).join(""):`<div class="empty">Bu ay satış kaydı yok.</div>`}
    </section>
  </div>`;
}
function kpi(l,v,s,neg,pos){return `<div class="kpi"><span class="lbl">${l}</span><span class="val ${neg?"neg":pos?"pos":""}">${v}</span><span class="sub">${s||""}</span></div>`}
function emptyH(){return `<div class="empty">Henüz kayıt yok. ${state.readonly?"":"Sağ üstteki <b>+ Yeni kayıt</b> ile ilk satışınızı veya giderinizi girin."}</div>`}
function sortH(a,b){return (b.tarih||"").localeCompare(a.tarih||"")||(b.olusturma||0)-(a.olusturma||0)}

function tabloH(list,actions){
  const rows=list.map(h=>{
    const c=cariById(h.cariId);const t=TYPES[h.tur]||TYPES.gider;
    const detay=[c?esc(c.ad):"",h.kanal&&h.tur==="satis"?esc(h.kanal):"",h.kategori&&h.tur==="gider"?esc(h.kategori):"",h.aciklama?esc(h.aciklama):""].filter(Boolean).join(" · ");
    return `<tr>
      <td class="date">${trDate(h.tarih)}</td>
      <td><span class="chip ${h.tur}">${t.ad}</span>${h.ornek?` <span class="chip ornek">Örnek</span>`:""}</td>
      <td style="min-width:180px">${detay||'<span class="muted">—</span>'}${h.belgeNo?`<div class="muted" style="font-size:.78rem">Belge: ${esc(h.belgeNo)}</div>`:""}</td>
      <td class="muted" style="white-space:nowrap">${esc(odemeAd(h))}</td>
      ${actions?`<td class="num">${t.kdvli?money(h.kdv):"—"}</td>`:""}
      <td class="num ${t.yon>0?"pos":"neg"}">${t.yon>0?"+":"−"}${money(h.toplam)}</td>
      ${actions&&!state.readonly?`<td><div class="rowact">${h.tur==="tahsilat"?`<button class="small ghost" data-act="makbuz" data-id="${h.id}" type="button">Makbuz</button>`:""}<button class="small ghost" data-act="edit" data-id="${h.id}" type="button">Düzenle</button><button class="small ghost danger" data-act="del" data-id="${h.id}" type="button">Sil</button></div></td>`:actions?"<td></td>":""}
    </tr>`}).join("");
  return `<div class="tscroll"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Cari / açıklama</th><th>Ödeme</th>${actions?'<th class="num">KDV</th>':""}<th class="num">Tutar</th>${actions?"<th></th>":""}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function vHareketler(){
  const q=ui.ara.trim().toLocaleLowerCase("tr");
  const list=state.hareketler.filter(h=>{
    if(ui.tur&&h.tur!==ui.tur)return false;
    if(ui.ay&&ym(h.tarih)!==ui.ay)return false;
    if(q){const c=cariById(h.cariId);const s=[h.aciklama,h.belgeNo,h.kanal,h.kategori,c&&c.ad].join(" ").toLocaleLowerCase("tr");if(!s.includes(q))return false}
    return true;
  }).sort(sortH);
  const o=donemOzet(h=>list.includes(h));
  return `<section class="panel">
    <div class="section-head"><h2>Hareketler</h2><button class="small" data-act="csv" type="button">Excel için CSV indir</button></div>
    <div class="filters">
      <select id="fTur" data-filter="tur" aria-label="Tür"><option value="">Tüm türler</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${ui.tur===k?"selected":""}>${v.ad}</option>`).join("")}</select>
      <input id="fAy" type="month" data-filter="ay" value="${esc(ui.ay)}" aria-label="Ay">
      <input id="fAra" type="search" data-filter="ara" value="${esc(ui.ara)}" placeholder="Cari, açıklama, belge no…" aria-label="Ara" style="flex:1;min-width:160px">
      ${ui.tur||ui.ay||ui.ara?`<button class="small ghost" data-act="temizle" type="button">Filtreyi temizle</button>`:""}
    </div>
    ${list.length?tabloH(list,true):(state.hareketler.length?`<div class="empty">Filtreye uyan kayıt yok.</div>`:emptyH())}
    ${list.length?`<div class="muted" style="font-size:.85rem">${list.length} kayıt · Satış ${money(o.satisNet+o.satisKdv)} · Alış+gider ${money(o.alisNet+o.alisKdv+o.giderNet+o.giderKdv)} · Tahsilat ${money(o.tahsilat)} · Ödeme ${money(o.odeme)}</div>`:""}
  </section>`;
}

function vCariler(){
  const list=state.cariler.filter(c=>!ui.cariTur||c.tur===ui.cariTur).map(c=>({...c,bakiye:cariBakiye(c.id)})).sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));

    ${list.length?`<div class="tscroll"><table><thead><tr><th>Ünvan</th><th>Tür</th><th>Vergi / TC no</th><th>Telefon</th><th class="num">Bakiye</th><th></th></tr></thead><tbody>
      ${list.map(c=>`<tr><td><b>${esc(c.ad)}</b>${c.ornek?` <span class="chip ornek">Örnek</span>`:""}${c.vergiDairesi?`<div class="muted" style="font-size:.78rem">${esc(c.vergiDairesi)} V.D.</div>`:""}</td>

        <td class="num ${c.bakiye>0?"pos":c.bakiye<0?"neg":""}">${money(Math.abs(c.bakiye))}<div style="font-size:.72rem;font-family:var(--font-body)" class="muted">${c.bakiye>0?"bize borçlu":c.bakiye<0?"biz borçluyuz":"kapalı"}</div></td>

  </section>`;

/* ---------- Teklifler ---------- */
const TEKLIF_DURUM=["Taslak","Gönderildi","Kabul edildi","Reddedildi"];
function gunEkle(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function satirTutar(s){const b=r2((Number(s.miktar)||0)*(Number(s.birimFiyat)||0));return r2(b-b*(Number(s.iskonto)||0)/100)}
function teklifTop(satirlar){let ara=0,isk=0,kdv=0;for(const s of satirlar){const b=r2((Number(s.miktar)||0)*(Number(s.birimFiyat)||0));const n=satirTutar(s);ara+=b;isk+=b-n;kdv+=r2(n*(Number(s.kdvOran)||0)/100)}return{ara:r2(ara),isk:r2(isk),net:r2(ara-isk),kdv:r2(kdv),toplam:r2(ara-isk+kdv)}}
function teklifMusteri(t){const c=cariById(t.cariId);return c?c.ad:(t.musteriAd||"—")}
function teklifSuresiGecti(t){return (t.durum==="Taslak"||t.durum==="Gönderildi")&&!!t.gecerlilik&&t.gecerlilik<today()}
function yeniTeklifNo(){const y=new Date().getFullYear();let n=0;state.teklifler.forEach(t=>{const m=/^TKL-(\d{4})-(\d+)$/.exec(t.no||"");if(m&&Number(m[1])===y)n=Math.max(n,Number(m[2]))});return `TKL-${y}-${String(n+1).padStart(4,"0")}`}
function durumChip(t){const c=t.durum==="Kabul edildi"?"satis":t.durum==="Reddedildi"?"alis":"";return `<span class="chip ${c}">${esc(t.durum)}</span>${teklifSuresiGecti(t)?` <span class="chip ornek">Süresi geçti</span>`:""}`}
function vTeklifler(){
  const all=state.teklifler.slice().sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||"")||(b.no||"").localeCompare(a.no||""));
  const list=all.filter(t=>!ui.tDurum||(ui.tDurum==="gecti"?teklifSuresiGecti(t):t.durum===ui.tDurum));
  const acik=all.filter(t=>t.durum==="Taslak"||t.durum==="Gönderildi");
  const buAy=ym(today());const kabul=all.filter(t=>t.durum==="Kabul edildi"&&ym(t.tarih)===buAy);
  const kabulTum=all.filter(t=>t.durum==="Kabul edildi").length,sonuc=kabulTum+all.filter(t=>t.durum==="Reddedildi").length;
  const gecen=all.filter(teklifSuresiGecti).length;
  const sum=l=>money(l.reduce((s,t)=>s+(t.toplam||0),0));
  return `<section class="section-head"><h2>Teklifler</h2>${state.readonly?"":`<button class="primary small" data-act="newTeklif" type="button">+ Yeni teklif</button>`}</section>
  <section class="kpis">
    ${kpi("Açık teklifler",String(acik.length),sum(acik)+" bekliyor")}
    ${kpi("Bu ay kabul edilen",sum(kabul),kabul.length+" teklif",false,kabul.length>0)}
    ${kpi("Kabul oranı",sonuc?"%"+Math.round(kabulTum/sonuc*100):"—",sonuc?sonuc+" sonuçlanan tekliften":"Henüz sonuçlanan yok")}
    ${kpi("Süresi geçen",String(gecen),"Yanıt alınamayan",gecen>0)}
  </section>
  <section class="panel">
    <div class="filters"><select id="fTDurum" data-filter="tDurum" aria-label="Durum"><option value="">Tüm teklifler</option>${TEKLIF_DURUM.map(d=>`<option ${ui.tDurum===d?"selected":""}>${d}</option>`).join("")}<option value="gecti" ${ui.tDurum==="gecti"?"selected":""}>Süresi geçenler</option></select></div>
    ${list.length?`<div class="tscroll"><table><thead><tr><th>Teklif no</th><th>Tarih</th><th>Müşteri</th><th>Geçerlilik</th><th class="num">Tutar</th><th>Durum</th><th></th></tr></thead><tbody>
    ${list.map(t=>`<tr><td class="date" style="color:var(--fg)"><b>${esc(t.no)}</b></td><td class="date">${trDate(t.tarih)}</td><td>${esc(teklifMusteri(t))}<div class="muted" style="font-size:.78rem">${(t.satirlar||[]).length} kalem</div></td><td class="date">${trDate(t.gecerlilik)}</td><td class="num">${money(t.toplam)}</td><td>${durumChip(t)}${t.satisIds&&t.satisIds.length?`<div class="muted" style="font-size:.74rem">satışa çevrildi</div>`:""}</td>
      <td><div class="rowact">${state.readonly?"":`<button class="small ghost" data-act="editTeklif" data-id="${t.id}" type="button">Aç</button>`}<button class="small ghost" data-act="tIndir" data-id="${t.id}" type="button">İndir</button><button class="small ghost" data-act="tKopya" data-id="${t.id}" type="button">Metni kopyala</button>${!state.readonly&&t.durum==="Kabul edildi"&&!(t.satisIds&&t.satisIds.length)?`<button class="small primary" data-act="tFatura" data-id="${t.id}" type="button">Fatura kes</button><button class="small" data-act="tSatis" data-id="${t.id}" type="button">Satışa çevir</button>`:""}</div></td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">${all.length?"Bu filtrede teklif yok.":"Henüz teklif yok. <b>+ Yeni teklif</b> ile okul, kurum veya toptan müşterilerinize fiyat teklifi hazırlayın; kabul edilince tek tıkla satışa çevirin."}</div>`}
  </section>`;
}

  if(!t.satirlar||!t.satirlar.length)t.satirlar=[{urunId:"",ad:"",miktar:1,birim:"Adet",birimFiyat:"",kdvOran:20,iskonto:0}];

      <td><input class="ln" data-i="${i}" data-f="miktar" id="tkMk${i}" type="number" min="0" step="1" value="${esc(s.miktar)}" style="width:70px;text-align:right"></td>
      <td><input class="ln" data-i="${i}" data-f="birimFiyat" id="tkBf${i}" type="number" min="0" step="0.01" value="${esc(s.birimFiyat)}" style="width:110px;text-align:right"></td>
      <td><select class="ln" data-i="${i}" data-f="kdvOran" id="tkKdv${i}">${KDV_ORAN.map(k=>`<option value="${k}" ${Number(s.kdvOran)===k?"selected":""}>%${k}</option>`).join("")}</select></td>
      <td><input class="ln" data-i="${i}" data-f="iskonto" id="tkIs${i}" type="number" min="0" max="100" step="1" value="${esc(s.iskonto)}" style="width:60px;text-align:right"></td>
      <td class="num" id="tkTt${i}">${money(satirTutar(s))}</td>
      <td>${t.satirlar.length>1?`<button class="small ghost danger" data-m="satirSil" data-i="${i}" type="button" aria-label="Satırı sil">Sil</button>`:""}</td></tr>`).join("")}
    </tbody></table></div><datalist id="tkUrunList">${state.urunler.map(u=>`<option value="${esc(u.ad)}"></option>`).join("")}</datalist>
    <div><button type="button" class="small" data-m="satirEkle">+ Satır ekle</button></div>`;
  const totals=()=>{const o=teklifTop(t.satirlar);return `<span>Ara toplam ${money(o.ara)}</span>${o.isk?`<span>İskonto −${money(o.isk)}</span>`:""}<span>KDV ${money(o.kdv)}</span><b>Genel toplam ${money(o.toplam)}</b>`};
  const body=`<div class="section-head"><h2>${existing?"Teklif "+esc(t.no):"Yeni teklif"}</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    <div class="grid2">
      <div class="field"><label for="tkCari">Müşteri (cari)</label><select id="tkCari"><option value="">Cari seçin veya aşağıya yazın</option>${cariOpts()}</select></div>

    <div class="calc" id="tkTop">${totals()}</div>

    <div class="modal-foot">${existing?`<button type="button" class="danger" data-m="sil">Sil</button><span style="flex:1"></span>`:""}<button type="button" data-m="close">Vazgeç</button><button type="button" class="primary" data-m="kaydet">Teklifi kaydet</button></div>`;

function ajandaTekrarlar(a,bas,son){
  const out=[];if(!a.tarih)return out;const bitis=a.tekrarBitis&&a.tekrarBitis<son?a.tekrarBitis:son;

    else if(a.tekrar==="yillik"){const y=d0.getFullYear()+i;d=new Date(y,d0.getMonth(),Math.min(gun,new Date(y,d0.getMonth()+1,0).getDate()))}

function tarihOku(v){if(v==null||v==="")return "";if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/.exec(s);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return ""}
function kdvOranTahmin(net,kdv){if(!(net>0))return 20;const r=kdv/net*100;return [20,10,1,0].reduce((b,x)=>Math.abs(x-r)<Math.abs(b-r)?x:b,20)}
function fatTamamla(v,varsayilanKdv){let net=v.net,kdv=v.kdv,top=v.toplam;
  if(isNaN(net))net=null;if(isNaN(kdv))kdv=null;if(isNaN(top))top=null;
  if(net!=null&&kdv!=null&&top==null)top=r2(net+kdv);
  else if(top!=null&&kdv!=null&&net==null)net=r2(top-kdv);
  else if(top!=null&&net!=null&&kdv==null)kdv=r2(top-net);
  else if(top!=null&&net==null&&kdv==null){net=r2(top/(1+varsayilanKdv/100));kdv=r2(top-net)}
  else if(net!=null&&kdv==null&&top==null){kdv=r2(net*varsayilanKdv/100);top=r2(net+kdv)}
  return {...v,net,kdv,toplam:top}}

      b.disabled=true;

        const o=teklifTop(satirlar);const gr={};satirlar.forEach(s=>{const k=Number(s.kdvOran)||0;gr[k]=(gr[k]||0)+satirTutar(s)});

        const id=existing?existing.id:api.newId("faturalar");

        if(opts.teklif){const {id:tid,...rest}=opts.teklif;await api.setDoc("teklifler",tid,{...rest,durum:"Kabul edildi",satisIds:hareketIds,stokIds,faturaId:id,satisTarih:f.tarih})}

function _norm(s){return String(s??"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g," ").trim()}

function kolonTahmin(basliklar,alanlar){const sec={};const kul=new Set();
  for(const pass of ["tam","ic"])for(const a of (alanlar||AKTAR_ALAN)){if(sec[a.k]!=null)continue;
    const i=basliklar.findIndex((h,j)=>{if(kul.has(j))return false;const n=_norm(h);if(!n)return false;if(a.haric&&a.haric.some(x=>n.includes(x)))return false;return pass==="tam"?a.tam.includes(n):a.ic.some(x=>n.includes(x))});
    if(i>=0){sec[a.k]=i;kul.add(i)}}
  return sec}
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref||"");if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+(ch.charCodeAt(0)-64);return n-1}

  await loadScript(LIBS.jszip);const z=await window.JSZip.loadAsync(buf);const P=s=>new DOMParser().parseFromString(s,"application/xml");const T=(el,n)=>Array.from(el.getElementsByTagNameNS("*",n));
  const ss=[];const ssf=z.file("xl/sharedStrings.xml");if(ssf){for(const si of T(P(await ssf.async("string")),"si"))ss.push(T(si,"t").map(n=>n.textContent).join(""))}

  try{const wb=P(await z.file("xl/workbook.xml").async("string"));const sh=T(wb,"sheet")[0];const rid=sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")||sh.getAttribute("r:id");
    for(const r of T(P(await z.file("xl/_rels/workbook.xml.rels").async("string")),"Relationship"))if(r.getAttribute("Id")===rid){const tg=r.getAttribute("Target");path=tg.startsWith("/")?tg.slice(1):"xl/"+tg.replace(/^\.\//,"")}}catch(e){}
  const f=z.file(path)||z.file(Object.keys(z.files).find(k=>/^xl\/worksheets\/.*\.xml$/.test(k)));if(!f)throw new Error("sayfa");
  const rows=[];for(const row of T(P(await f.async("string")),"row")){const r=[];for(const c of T(row,"c")){const t=c.getAttribute("t");const vv=T(c,"v")[0];let v="";
      if(t==="s")v=vv?ss[Number(vv.textContent)]??"":"";else if(t==="inlineStr")v=T(c,"t").map(n=>n.textContent).join("");else{v=vv?vv.textContent:"";if(t!=="str"&&t!=="e"&&v!==""&&!isNaN(v))v=Number(v)}

function csvOku(buf){let text=new TextDecoder("utf-8").decode(buf);if(text.includes("\uFFFD")){try{text=new TextDecoder("windows-1254").decode(buf)}catch(e){}}

    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=ch}

    root.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;const er=root.querySelector("#akErr"),du=root.querySelector("#akDurum");
      if(b.dataset.m==="close")return closeModal();
      if(b.dataset.m!=="aktar"||!rows)return;
      if(map.ad==null||map.ad===""){er.textContent="Ürün adı sütununu seçin.";return}
      const o=plan();const yeniEkle=root.querySelector("#akYeni").checked,stokEs=root.querySelector("#akStok").checked&&map.stok!=null,fiyatG=root.querySelector("#akFiyat").checked;
      const isler=[];
      if(yeniEkle)o.yeni.forEach(v=>isler.push(async()=>{const id=api.newId("urunler");await api.setDoc("urunler",id,{ad:v.ad,kod:v.kod,barkod:v.barkod,kategori:v.kategori,birim:"Adet",alisFiyat:v.alisFiyat??0,satisFiyat:v.satisFiyat??0,kdvOran:v.kdvOran??20,kritik:"",acilis:v.stok??0,kaynak:"Excel",olusturma:Date.now()})}));
      o.guncel.forEach(({ex,v})=>{const {id,...rest}=ex;const yeni={...rest};let degisti=false;
        if(fiyatG){for(const k of ["satisFiyat","alisFiyat","kdvOran"])if(v[k]!=null&&v[k]!==ex[k]){yeni[k]=v[k];degisti=true}if(v.kategori&&v.kategori!==ex.kategori){yeni.kategori=v.kategori;degisti=true}}
        if(v.barkod&&!ex.barkod){yeni.barkod=v.barkod;degisti=true}if(v.kod&&!ex.kod){yeni.kod=v.kod;degisti=true}
        if(degisti)isler.push(()=>api.setDoc("urunler",id,yeni));
        if(stokEs&&v.stok!=null){const fark=r2(v.stok-stokMiktar(ex));if(fark)isler.push(()=>api.setDoc("stokHareketleri",api.newId("stokHareketleri"),{urunId:id,tarih:today(),tip:"Sayım",miktar:fark,birimFiyat:Number(ex.alisFiyat)||0,aciklama:"Excel aktarımı ("+dosya+")",hareketId:"",olusturma:Date.now()}))}});
      if(!isler.length){closeModal();toast("Değişiklik yok, stok zaten güncel");return}
      root.querySelectorAll("button,select,input").forEach(x=>x.disabled=true);let n=0,hata=0;
      let sira=0;const isci=async()=>{while(sira<isler.length){const is=isler[sira++];let dene=0;for(;;){try{await is();break}catch(err){if((err&&(err.code==="resource_exhausted"||err.code==="unavailable"))&&dene<6){dene++;await new Promise(r=>setTimeout(r,700*dene+Math.random()*400));continue}hata++;break}}
        n++;if(n%10===0||n===isler.length)du.textContent=`Aktarılıyor… ${n} / ${isler.length} (sayfayı kapatmayın)`}};
      await Promise.all(Array.from({length:Math.min(6,isler.length)},isci));
      closeModal();toast(hata?`${isler.length-hata} işlem tamamlandı, ${hata} kayıt aktarılamadı`:`Aktarım tamamlandı: ${o.yeni.length&&yeniEkle?o.yeni.length+" yeni ürün, ":""}${o.guncel.length} eşleşen ürün`)});
  });
}

function maasGunuTarih(p){const g=Number(p.maasGunu);if(!g)return null;const d=new Date();return Math.min(g,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())}
function maasGecikti(p){const g=maasGunuTarih(p);return !!g&&new Date().getDate()>g&&kalanMaas(p)>0}
const IZIN_TIP=["Yıllık izin","Ekstra izin","Mazeret izni","Raporlu","Ücretsiz izin"];
function izinGun(bas,bit){if(!bas||!bit||bit<bas)return 0;let n=0;const d=new Date(bas+"T00:00:00"),e=new Date(bit+"T00:00:00");while(d<=e){if(d.getDay()!==0)n++;d.setDate(d.getDate()+1)}return n}
function kidemYil(p){if(!p.baslangic)return 0;const s=new Date(p.baslangic+"T00:00:00"),t=new Date();let y=t.getFullYear()-s.getFullYear();if(t.getMonth()<s.getMonth()||(t.getMonth()===s.getMonth()&&t.getDate()<s.getDate()))y--;return Math.max(0,y)}
function yillikHak(p,k){if(Number(p.izinHakki)>0)return Number(p.izinHakki);return k<=5?14:k<15?20:26}
function izinde(id){const t=today();return state.izinler.some(z=>z.personelId===id&&z.baslangic<=t&&z.bitis>=t)}
function izinOzet(p){
  const k=kidemYil(p);let hak=0;for(let i=1;i<=k;i++)hak+=yillikHak(p,i);
  const l=state.izinler.filter(z=>z.personelId===p.id);
  const sum=f=>r2(l.filter(f).reduce((s,z)=>s+(Number(z.gun)||0),0));
  const yil=String(new Date().getFullYear());const by=z=>(z.baslangic||"").startsWith(yil);
  let sonraki="";if(p.baslangic){const s=new Date(p.baslangic+"T00:00:00");s.setFullYear(s.getFullYear()+k+1);sonraki=s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")+"-"+String(s.getDate()).padStart(2,"0")}
  const kullanilan=sum(z=>z.dus);
  return {kidem:k,hak,kullanilan,kalan:r2(hak-kullanilan),sonraki,sonrakiHak:yillikHak(p,k+1),
    buYil:{"Yıllık izin":sum(z=>by(z)&&z.tip==="Yıllık izin"),"Ekstra izin":sum(z=>by(z)&&z.tip==="Ekstra izin"),"Mazeret izni":sum(z=>by(z)&&z.tip==="Mazeret izni"),"Raporlu":sum(z=>by(z)&&z.tip==="Raporlu"),"Ücretsiz izin":sum(z=>by(z)&&z.tip==="Ücretsiz izin")}};
}

      ${kpi("Kullanılan",gs(o.kullanilan),"Yıllık izinden düşenler")}
      ${kpi("Kalan yıllık izin",gs(o.kalan),o.kalan<0?"Hakkından fazla kullandı":"",o.kalan<0,o.kalan>0)}

    ${ro?"":`<div class="panel" style="padding:12px;gap:10px"><b style="font-size:.9rem">İzin ekle</b>
      <div class="grid2">
        <div class="field"><label for="iTip">İzin türü</label><select id="iTip">${IZIN_TIP.map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="iGun">Gün sayısı</label><input id="iGun" type="number" step="0.5" min="0" inputmode="decimal" value="1"></div>
        <div class="field"><label for="iBas">Başlangıç</label><input id="iBas" type="date" value="${today()}"></div>
        <div class="field"><label for="iBit">Bitiş</label><input id="iBit" type="date" value="${today()}"></div>
      </div>
      <label id="iDusRow" hidden style="display:flex;gap:8px;align-items:center;font-size:.88rem"><input id="iDus" type="checkbox"> Yıllık izin hakkından düşülsün</label>
      <div class="field"><label for="iAcik">Not</label><input id="iAcik" placeholder="Örn. düğün izni, yarım gün"></div>

      <div class="err" id="iErr" role="alert"></div>
      <div class="modal-foot"><button type="button" class="primary" data-m="izinKaydet">İzni kaydet</button></div></div>`}
    <b style="font-size:.9rem">İzin geçmişi</b>
    ${list.length?`<div class="tscroll"><table><thead><tr><th>Tarih</th><th>Tür</th><th class="num">Gün</th><th>Not</th><th></th></tr></thead><tbody>
      ${list.map(z=>`<tr><td class="date">${trDate(z.baslangic)}${z.bitis&&z.bitis!==z.baslangic?" – "+trDate(z.bitis):""}</td><td><span class="chip ${z.tip==="Yıllık izin"?"satis":z.tip==="Ücretsiz izin"?"alis":z.tip==="Ekstra izin"?"ornek":""}">${esc(z.tip)}</span>${z.dus&&z.tip!=="Yıllık izin"?`<div class="muted" style="font-size:.74rem">yıllıktan düştü</div>`:""}</td><td class="num">${String(z.gun).replace(".",",")}</td><td>${esc(z.aciklama||"")||'<span class="muted">—</span>'}</td><td>${state.readonly?"":`<button class="small ghost danger" data-m="izinSil" data-id="${z.id}" type="button">Sil</button>`}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Bu personele henüz izin girilmedi.</div>`}
    <div class="muted" style="font-size:.82rem">Yıllık izin hakkı kıdeme göre hesaplanır: 1–5 yıl 14, 5–15 yıl 20, 15 yıl ve üzeri 26 gün. Personel kartında farklı bir gün girdiyseniz o kullanılır.</div>`;
  const bind=root=>{
    root.dataset.izin=pid;
    if(root.dataset.bound)return;root.dataset.bound="1";
    const syncTip=()=>{const t=root.querySelector("#iTip");if(!t)return;const row=root.querySelector("#iDusRow");row.hidden=!(t.value==="Ekstra izin"||t.value==="Mazeret izni");if(row.hidden)root.querySelector("#iDus").checked=false};
    root.addEventListener("change",e=>{
      if(e.target.id==="iTip")syncTip();
      if(e.target.id==="iBas"||e.target.id==="iBit"){const b=root.querySelector("#iBas"),t=root.querySelector("#iBit");if(e.target.id==="iBas"&&t.value<b.value)t.value=b.value;root.querySelector("#iGun").value=izinGun(b.value,t.value)}
    });
    root.addEventListener("click",async e=>{
      const b=e.target.closest("[data-m]");if(!b)return;const a=b.dataset.m;
      if(a==="close")return closeModal();
      if(a==="izinSil"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Onayla";return}
        b.disabled=true;try{await api.del("izinler",b.dataset.id);toast("İzin silindi");izinEkrani(pid)}catch(err){toast(errMsg(err))}return}
      if(a==="izinKaydet"){const er=root.querySelector("#iErr");const g=id=>root.querySelector("#"+id).value.trim();
        const tip=g("iTip"),bas=g("iBas"),bit=g("iBit"),gun=r2(g("iGun"));
        if(!bas||!bit){er.textContent="Başlangıç ve bitiş tarihini girin.";return}
        if(bit<bas){er.textContent="Bitiş tarihi başlangıçtan önce olamaz.";return}
        if(!(gun>0)){er.textContent="Gün sayısı sıfırdan büyük olmalı.";return}
        const dus=tip==="Yıllık izin"||((tip==="Ekstra izin"||tip==="Mazeret izni")&&root.querySelector("#iDus").checked);
        const doc={personelId:p.id,tip,baslangic:bas,bitis:bit,gun,dus,aciklama:g("iAcik"),olusturma:Date.now()};
        b.disabled=true;try{await api.setDoc("izinler",api.newId("izinler"),doc);toast(tip+" kaydedildi");izinEkrani(pid)}catch(err){er.textContent=errMsg(err);b.disabled=false}}
    });
  };
  const modal=modalRoot.querySelector(".modal");
  if(modal&&modal.dataset.izin===pid){modal.innerHTML=body;return}
  openModal(body,bind);
}

function urunIndirim(root){const q=id=>root.querySelector("#"+id);const adet=Math.max(0,Math.round(Number(q("uAdet").value)||0)),fiyat=r2(q("uFiyat").value),liste=r2(adet*fiyat);const tip=q("uIndTip")?q("uIndTip").value:"%";const v=Math.max(0,Number(q("uInd")?q("uInd").value:0)||0);let ind=tip==="%"?r2(liste*Math.min(v,100)/100):r2(Math.min(v,liste));return {adet,fiyat,liste,tip,v,ind,t:r2(liste-ind)}}
function urunEkrani(pid){
  const p=state.personeller.find(x=>x.id===pid);if(!p)return;
  const buAy=ym(today());
  const list=state.ekler.filter(e=>e.personelId===p.id&&e.tip==="Ürün").sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||"")||(b.olusturma||0)-(a.olusturma||0));
  const gruplar={};list.forEach(e=>{const k=ym(e.tarih);(gruplar[k]=gruplar[k]||[]).push(e)});
  const ayUrun=buAyEk(p.id,"Ürün");
  const ro=state.readonly||p.durum==="ayrildi";
  const body=`<div class="section-head"><h2>${esc(p.ad)} · ürün alımı</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      ${kpi("Bu ay ürün",money(ayUrun),list.filter(e=>ym(e.tarih)===buAy).length+" kayıt",ayUrun>0)}
      ${kpi("Bu ay hak ediş",money(hakEdis(p)),"Maaş + mesai + prim − ürün")}
      ${kpi("Ödenecek kalan",money(kalanMaas(p)),"Ödenenler düşüldü")}
    </div>
    ${(Number(p.maas)||0)&&ayUrun>(Number(p.maas)||0)?`<div class="notice"><b>Dikkat:</b> Bu ayki ürün alımları net maaşı aşıyor.</div>`:""}
    ${ro?"":`<div class="panel" style="padding:12px;gap:10px"><b style="font-size:.9rem">Ürün ekle</b>
      ${state.urunler.length?`<div class="field"><label for="uStok">Stoktan seç (isteğe bağlı)</label><select id="uStok"><option value="">Stokta olmayan / elle gir</option>${state.urunler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(u=>`<option value="${u.id}">${esc(u.ad)} · stok ${fmtMiktar(stokMiktar(u))}</option>`).join("")}</select></div>`:""}
      <div class="field"><label for="uAd">Ürün</label><input id="uAd" placeholder="Örn. Aquacool akıllı boya seti"></div>
      <div class="grid2">
        <div class="field"><label for="uTarih">Tarih</label><input id="uTarih" type="date" value="${today()}"></div>
        <div class="field"><label for="uAdet">Adet</label><input id="uAdet" type="number" min="1" step="1" inputmode="numeric" value="1"></div>
        <div class="field"><label for="uFiyat">Birim fiyat, KDV dahil (₺)</label><input id="uFiyat" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></div>
        <div class="field"><label for="uKdv">KDV %</label><select id="uKdv">${KDV_ORAN.map(k=>`<option value="${k}">%${k}</option>`).join("")}</select></div>
      </div>
      <div class="panel" style="padding:10px 12px;gap:8px;background:var(--surface-2);border-color:transparent">
        <b style="font-size:.86rem">İndirim</b>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select id="uIndTip" aria-label="İndirim türü"><option value="%">Yüzde (%)</option><option value="tl">Tutar (₺)</option></select>
          <input id="uInd" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(p.indirim||"")}" placeholder="0" style="width:100px" aria-label="İndirim">
          ${[0,5,10,15,20,25].map(v=>`<button type="button" class="small ghost" data-m="indHizli" data-v="${v}">${v?"%"+v:"İndirimsiz"}</button>`).join("")}
        </div>
        ${p.indirim?`<div class="muted" style="font-size:.78rem">Personel kartındaki %${p.indirim} indirim otomatik uygulandı.</div>`:`<div class="muted" style="font-size:.78rem">Sürekli indirim için personel kartına “Personel indirimi (%)” girebilirsiniz.</div>`}
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:.88rem"><input id="uSatis" type="checkbox" checked style="margin-top:3px"> <span>Satış olarak da kaydet <span class="muted">(gelir ve KDV raporuna girer, kasaya para girmez)</span></span></label>
      <div class="calc" id="uCalc"></div>
      <div class="err" id="uErr" role="alert"></div>
      <div class="modal-foot"><button type="button" class="primary" data-m="urunKaydet">Maaştan düş</button></div></div>`}
    <b style="font-size:.9rem">Alım geçmişi</b>
    ${list.length?`<div class="tscroll"><table><thead><tr><th>Tarih</th><th>Ürün</th><th class="num">Adet</th><th class="num">Tutar</th><th></th></tr></thead><tbody>
      ${Object.entries(gruplar).map(([k,l])=>`<tr><td colspan="5" style="background:var(--surface-2);font-weight:600;font-size:.8rem">${AYLAR[Number(k.slice(5,7))-1]} ${k.slice(0,4)} · ${money(l.reduce((s,e)=>s+(e.tutar||0),0))}</td></tr>`+l.map(e=>`<tr><td class="date">${trDate(e.tarih)}</td><td>${esc(e.urun||"Ürün")}${e.satisId?`<div class="muted" style="font-size:.74rem">satış olarak kaydedildi</div>`:""}</td><td class="num">${e.adet||1} × ${money(e.birimFiyat||e.tutar)}</td><td class="num">${e.indirim?`<div class="muted" style="font-size:.74rem;text-decoration:line-through">${money(e.listeTutar)}</div>`:""}${money(e.tutar)}${e.indirim?`<div class="pos" style="font-size:.74rem;font-family:var(--font-body)">${e.indirimTip==="%"?"%"+fmtMiktar(e.indirimDeger)+" ":""}indirim</div>`:""}</td><td>${state.readonly?"":`<button class="small ghost danger" data-m="urunSil" data-id="${e.id}" type="button">Sil</button>`}</td></tr>`).join("")).join("")}
    </tbody></table></div>`:`<div class="empty">Bu personelin henüz ürün alımı yok.</div>`}
    <div class="muted" style="font-size:.82rem">Alınan ürünler o ayın hak edişinden düşer. “Ödeme yap” ekranında maaş tutarı ürün bedeli düşülmüş olarak gelir. Bir kaydı silerseniz bağlı satış kaydı da silinir.</div>`;
  const bind=root=>{
    root.dataset.urun=pid;
    const calc=()=>{const c=root.querySelector("#uCalc");if(!c)return;const o=urunIndirim(root);c.innerHTML=`<span>${o.adet} × ${money(o.fiyat)} = ${money(o.liste)}</span>${o.ind?`<span class="pos">İndirim ${o.tip==="%"?"%"+fmtMiktar(o.v)+" ":""}−${money(o.ind)}</span>`:""}<b>Maaştan düşülecek ${money(o.t)}</b>`};
    calc();
    if(root.dataset.bound)return;root.dataset.bound="1";
    root.addEventListener("input",calc);
    root.addEventListener("change",e=>{if(e.target.id!=="uStok")return;const u=state.urunler.find(x=>x.id===e.target.value);if(!u)return;root.querySelector("#uAd").value=u.ad;if(u.satisFiyat)root.querySelector("#uFiyat").value=u.satisFiyat;root.querySelector("#uKdv").value=String(u.kdvOran??20);calc()});
    root.addEventListener("click",async e=>{
      const b=e.target.closest("[data-m]");if(!b)return;const a=b.dataset.m;
      if(a==="close")return closeModal();
      if(a==="indHizli"){root.querySelector("#uIndTip").value="%";root.querySelector("#uInd").value=b.dataset.v==="0"?"":b.dataset.v;calc();return}
      if(a==="urunSil"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Onayla";return}
        b.disabled=true;const ek=state.ekler.find(x=>x.id===b.dataset.id);
        try{if(ek&&ek.satisId)await api.del("hareketler",ek.satisId);if(ek&&ek.stokHareketId)await api.del("stokHareketleri",ek.stokHareketId);await api.del("personelEk",b.dataset.id);toast("Kayıt silindi");urunEkrani(pid)}catch(err){toast(errMsg(err))}return}
      if(a==="urunKaydet"){const er=root.querySelector("#uErr");const g=id=>root.querySelector("#"+id).value.trim();
        const stokU=root.querySelector("#uStok")?state.urunler.find(x=>x.id===root.querySelector("#uStok").value):null;
        const io=urunIndirim(root);
        const urun=g("uAd"),tarih=g("uTarih"),adet=io.adet,fiyat=io.fiyat,t=io.t,oran=Number(g("uKdv"));
        if(io.liste>0&&io.ind>=io.liste){er.textContent="İndirim ürün tutarından küçük olmalı.";return}
        if(!urun){er.textContent="Ürün adını girin.";return}
        if(!tarih){er.textContent="Tarih girin.";return}
        if(!(adet>0)){er.textContent="Adet en az 1 olmalı.";return}
        if(!(t>0)){er.textContent="Birim fiyatı girin.";return}
        b.disabled=true;
        try{let satisId="";
          if(root.querySelector("#uSatis").checked){satisId=api.newId("hareketler");const net=r2(t/(1+oran/100));
            await api.setDoc("hareketler",satisId,{tur:"satis",tarih,odeme:"mahsup",cariId:"",kanal:"Personel",kategori:"",kdvOran:oran,net,kdv:r2(t-net),toplam:t,aciklama:"Personel alımı · "+p.ad+" · "+urun+(adet>1?" ×"+adet:"")+(io.ind?" · "+(io.tip==="%"?"%"+io.v+" ":"")+"indirim "+money(io.ind):""),belgeNo:"",olusturma:Date.now()})}
          let stokHareketId="";
          if(stokU){stokHareketId=api.newId("stokHareketleri");await api.setDoc("stokHareketleri",stokHareketId,{urunId:stokU.id,tarih,tip:"Çıkış",miktar:-adet,birimFiyat:r2(t/adet),aciklama:"Personel alımı · "+p.ad+(io.ind?" · indirimli":""),hareketId:satisId,olusturma:Date.now()})}
          await api.setDoc("personelEk",api.newId("personelEk"),{personelId:p.id,tip:"Ürün",tarih,urun,adet,birimFiyat:fiyat,listeTutar:io.liste,indirimTip:io.tip,indirimDeger:io.v,indirim:io.ind,tutar:t,satisId,stokHareketId,olusturma:Date.now()});
          toast(money(t)+" maaştan düşüldü");urunEkrani(pid)}
        catch(err){er.textContent=errMsg(err);b.disabled=false}}
    });
  };
  const modal=modalRoot.querySelector(".modal");
  if(modal&&modal.dataset.urun===pid){modal.innerHTML=body;bind(modal);return}
  openModal(body,bind);
}

const BANKA_ADLARI=["Ziraat Bankası","Türkiye İş Bankası","Garanti BBVA","Akbank","Yapı Kredi","Halkbank","VakıfBank","QNB","DenizBank","TEB","Kuveyt Türk","Enpara","ING","Şekerbank","Albaraka","Papara"];
function fmtIban(s){return String(s||"").replace(/\s+/g,"").replace(/(.{4})/g,"$1 ").trim()}
function vBankalar(){

}

const modalRoot=document.getElementById("modalRoot");
function closeModal(){modalRoot.innerHTML="";document.removeEventListener("keydown",escClose)}
function escClose(e){if(e.key==="Escape")closeModal()}
function openModal(html,onMount){
  modalRoot.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
  document.addEventListener("keydown",escClose);
  onMount&&onMount(modalRoot.querySelector(".modal"));
  const f=modalRoot.querySelector("input,select");f&&f.focus();
}

function hareketForm(existing,presetTur){
  const h=existing?{...existing}:{tur:presetTur||"satis",tarih:today(),odeme:"kasa",kdvOran:20,kanal:"Mağaza",kategori:"Kargo",net:"",toplam:"",cariId:"",aciklama:"",belgeNo:"",bankaId:""};

  let fiyatTipi="dahil"; // KDV dahil tutar girişi varsayılan
  if(existing&&TYPES[h.tur].kdvli){fiyatTipi="haric"}
  function body(){
    const t=TYPES[h.tur];
    const cariOpts=state.cariler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(c=>`<option value="${c.id}" ${h.cariId===c.id?"selected":""}>${esc(c.ad)}</option>`).join("");

    <div class="grid2">
      <div class="field"><label for="mTarih">Tarih</label><input id="mTarih" type="date" value="${esc(h.tarih)}"></div>
      <div class="field"><label for="mOdeme">${h.tur==="tahsilat"?"Nereye girdi":h.tur==="odeme"?"Nereden çıktı":"Ödeme şekli"}</label><select id="mOdeme">${odemeOpts}</select></div>
    </div>
    ${h.odeme==="banka"&&state.bankalar.length?`<div class="field"><label for="mBanka">Banka hesabı</label><select id="mBanka">${state.bankalar.map(b=>`<option value="${b.id}" ${hBankaId(h)===b.id?"selected":""}>${esc(bankaAd(b.id))}</option>`).join("")}</select></div>`:""}
    <div class="field"><label for="mCari">Cari ${h.odeme==="acik"||!t.kdvli?"(zorunlu)":"(isteğe bağlı)"}</label>
      <div style="display:flex;gap:6px"><select id="mCari" style="flex:1"><option value="">${state.cariler.length?"Cari seçin":"Henüz cari yok"}</option>${cariOpts}</select><button type="button" class="small" data-m="hizliCari">+ Yeni</button></div></div>
    ${h.tur==="satis"?`<div class="field"><label for="mKanal">Satış kanalı</label><select id="mKanal">${KANALLAR.map(k=>`<option ${h.kanal===k?"selected":""}>${k}</option>`).join("")}</select></div>`:""}
    ${h.tur==="gider"?`<div class="field"><label for="mKat">Gider kalemi</label><select id="mKat">${GIDER_KAT.map(k=>`<option ${h.kategori===k?"selected":""}>${k}</option>`).join("")}</select></div>`:""}
    ${t.kdvli?`<div class="grid2">
      <div class="field"><label for="mTutar">Tutar (₺)</label><input id="mTutar" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(tutarVal)}" placeholder="0,00"></div>
      <div class="grid2" style="gap:8px">
        <div class="field"><label for="mOran">KDV %</label><select id="mOran">${KDV_ORAN.map(k=>`<option value="${k}" ${Number(h.kdvOran)===k?"selected":""}>%${k}</option>`).join("")}</select></div>
        <div class="field"><label for="mTip">Tutar</label><select id="mTip"><option value="dahil" ${fiyatTipi==="dahil"?"selected":""}>KDV dahil</option><option value="haric" ${fiyatTipi==="haric"?"selected":""}>KDV hariç</option></select></div>
      </div></div>
      <div class="calc" id="mCalc"></div>`:`<div class="field"><label for="mTutar">Tutar (₺)</label><input id="mTutar" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(tutarVal)}" placeholder="0,00"></div>`}
    <div class="grid2">
      <div class="field"><label for="mBelge">Belge / fatura no</label><input id="mBelge" value="${esc(h.belgeNo||"")}" placeholder="Örn. SFK2026000123"></div>
      <div class="field"><label for="mAcik">Açıklama</label><input id="mAcik" value="${esc(h.aciklama||"")}" placeholder="Kısa not"></div>
    </div>
    <div class="err" id="mErr" role="alert"></div>
    <div class="modal-foot">${existing?`<button type="button" class="danger" data-m="sil">Sil</button><span style="flex:1"></span>`:""}<button type="button" data-m="close">Vazgeç</button><button type="button" class="primary" data-m="kaydet">Kaydet</button></div>`;
  }
  function readInputs(root){
    const g=id=>root.querySelector("#"+id);
    h.tarih=g("mTarih").value;h.odeme=g("mOdeme").value;h.cariId=g("mCari").value;if(g("mBanka"))h.bankaId=g("mBanka").value;
    if(g("mKanal"))h.kanal=g("mKanal").value;if(g("mKat"))h.kategori=g("mKat").value;
    h.belgeNo=g("mBelge").value.trim();h.aciklama=g("mAcik").value.trim();
    const v=g("mTutar").value;
    if(TYPES[h.tur].kdvli){h.kdvOran=Number(g("mOran").value);fiyatTipi=g("mTip").value;
      if(fiyatTipi==="haric"){h.net=v}else{h.toplam=v}}
    else{h.toplam=v}
  }
  function compute(){
    const t=TYPES[h.tur];
    if(!t.kdvli){const tp=r2(h.toplam);return {net:tp,kdv:0,toplam:tp}}
    const o=Number(h.kdvOran)/100;
    if(fiyatTipi==="haric"){const n=r2(h.net);const k=r2(n*o);return {net:n,kdv:k,toplam:r2(n+k)}}
    const tp=r2(h.toplam);const n=r2(tp/(1+o));return {net:n,kdv:r2(tp-n),toplam:tp};
  }

    const updCalc=()=>{const c=root.querySelector("#mCalc");if(!c)return;readInputs(root);const r=compute();c.innerHTML=`<span>Net ${money(r.net)}</span><span>KDV ${money(r.kdv)}</span><b>Toplam ${money(r.toplam)}</b>`};

      if(a==="close")return closeModal();
      if(a==="tur"){readInputs(root);const prev=TYPES[h.tur].kdvli;h.tur=b.dataset.v;

        root.querySelector("#mYeniCari").focus();return}
      if(a==="hizliKaydet"){const ad=root.querySelector("#mYeniCari").value.trim();if(!ad)return;
        const id=api.newId("cariler");const c={ad,tur:h.tur==="satis"||h.tur==="tahsilat"?"musteri":"tedarikci",vergiNo:"",vergiDairesi:"",telefon:"",olusturma:Date.now()};
        b.disabled=true;try{await api.setDoc("cariler",id,c);state.cariler=state.cariler.filter(x=>x.id!==id).concat({id,...c});readInputs(root);h.cariId=id;redraw()}catch(err){root.querySelector("#mErr").textContent=errMsg(err);b.disabled=false}return}
      if(a==="sil"){b.outerHTML=`<span class="err" style="align-self:center">Kalıcı olarak silinsin mi?</span><button type="button" class="danger" data-m="silOnay">Evet, sil</button>`;return}
      if(a==="silOnay"){b.disabled=true;try{await api.del("hareketler",existing.id);closeModal();toast("Kayıt silindi")}catch(err){root.querySelector("#mErr").textContent=errMsg(err);b.disabled=false}return}
      if(a==="kaydet"){
        readInputs(root);const r=compute();const er=root.querySelector("#mErr");const t=TYPES[h.tur];
        if(!h.tarih){er.textContent="Tarih girin.";return}
        if(!(r.toplam>0)){er.textContent="Tutar sıfırdan büyük olmalı.";return}

        const doc={tur:h.tur,tarih:h.tarih,odeme:h.odeme,cariId:h.cariId||"",aciklama:h.aciklama,belgeNo:h.belgeNo,
          kanal:h.tur==="satis"?h.kanal:"",kategori:h.tur==="gider"?h.kategori:"",bankaId:h.odeme==="banka"?(h.bankaId||""):"",

          olusturma:existing?(existing.olusturma||Date.now()):Date.now()};
        if(existing&&existing.ornek)doc.ornek=true;
        if(doc.tur==="tahsilat")doc.makbuzNo=(existing&&existing.makbuzNo)||yeniMakbuzNo();
        if(existing&&existing.personelId&&doc.tur==="gider"){doc.personelId=existing.personelId;doc.odemeTip=existing.odemeTip||"Diğer"}

function ekstre(id){
  const c=cariById(id);if(!c)return;
  const list=state.hareketler.filter(h=>h.cariId===id).sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"")||(a.olusturma||0)-(b.olusturma||0));
  let bak=0;
  const rows=list.map(h=>{let borc=0,alacak=0;const t=h.toplam||0;
    if(h.tur==="satis"&&h.odeme==="acik")borc=t;else if(h.tur==="tahsilat")alacak=t;
    else if((h.tur==="alis"||h.tur==="gider")&&h.odeme==="acik")alacak=t;else if(h.tur==="odeme")borc=t;
    bak=r2(bak+borc-alacak);
    return `<tr><td class="date">${trDate(h.tarih)}</td><td>${TYPES[h.tur].ad}${h.odeme!=="acik"&&TYPES[h.tur].kdvli?' <span class="muted">(peşin)</span>':""}${h.belgeNo?`<div class="muted" style="font-size:.78rem">${esc(h.belgeNo)}</div>`:""}</td><td class="num">${borc?money(borc):""}</td><td class="num">${alacak?money(alacak):""}</td><td class="num">${money(Math.abs(bak))} ${bak>0?"B":bak<0?"A":""}</td></tr>`}).join("");
  openModal(`<div class="section-head"><h2>${esc(c.ad)} ekstresi</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    ${list.length?`<div class="tscroll"><table><thead><tr><th>Tarih</th><th>İşlem</th><th class="num">Borç</th><th class="num">Alacak</th><th class="num">Bakiye</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.82rem">B: cari bize borçlu · A: biz cariye borçluyuz. Peşin satış ve alışlar bakiyeyi etkilemez.</div>`:`<div class="empty">Bu cariye ait hareket yok.</div>`}`,

}

function errMsg(e){const c=e&&e.code;
  if(c==="invalid_argument")return "Kayıt yapılamadı: bu sayfada yazma yetkiniz olmayabilir.";
  if(c==="quota_exceeded")return "Depolama sınırı doldu. Eski kayıtları silip tekrar deneyin.";
  if(c==="resource_exhausted")return "Çok hızlı işlem yapıldı, birkaç saniye bekleyip tekrar deneyin.";
  if(c==="unavailable")return "Bağlantı kurulamadı, tekrar deneyin.";

async function csvIndir(){
  const head=["Tarih","Tür","Cari","Vergi No","Kanal","Gider kalemi","Belge No","Açıklama","Ödeme","KDV %","Net","KDV","Toplam"];
  const n=x=>(Number(x)||0).toFixed(2).replace(".",",");
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const rows=[...state.hareketler].sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"")).map(h=>{const c=cariById(h.cariId);
    return [trDate(h.tarih),TYPES[h.tur].ad,c?c.ad:"",c?c.vergiNo:"",h.kanal,h.kategori,h.belgeNo,h.aciklama,ODEME[h.odeme],h.kdvOran,n(h.net),n(h.kdv),n(h.toplam)].map(q).join(";")});
  const csv="﻿"+[head.map(q).join(";"),...rows].join("\r\n");
  const name="on-muhasebe-"+today()+".csv";
  if(downloads){try{await downloads.save({filename:name,data:csv});return}catch(e){if(e&&e.code==="declined")return}}
  try{await navigator.clipboard.writeText(csv);toast("CSV panoya kopyalandı, Excel'e yapıştırabilirsiniz")}catch(e){toast("Dosya indirilemedi")}
}

async function cikisYap(){try{if(kanal)sb.removeChannel(kanal);kanal=null;await sb.auth.signOut()}catch(e){}oturum=null;firmaId=null;for(const s of Object.values(KOLEKSIYONLAR))state[s]=[];state.firma="";girisEkrani()}
function idUret(){const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";for(const x of crypto.getRandomValues(new Uint8Array(20)))s+=a[x%36];return s}
let _rt=null;function renderSonra(){clearTimeout(_rt);_rt=setTimeout(render,120)}
function yerelUygula(col,id,veri){if(col==="ayar"){if(id==="firma")state.firma=veri?veri.ad||"":"";return}const k=KOLEKSIYONLAR[col];if(!k)return;const arr=state[k].filter(x=>x.id!==id);if(veri)arr.push({id,...veri});state[k]=arr}
async function tumunuYukle(){const rows=[];const N=1000;for(let from=0;;from+=N){const {data,error}=await sb.from("kayitlar").select("koleksiyon,id,veri").eq("firma_id",firmaId).order("koleksiyon").order("id").range(from,from+N-1);if(error)throw error;rows.push(...data);if(data.length<N)break}
  for(const s of Object.values(KOLEKSIYONLAR))state[s]=[];state.firma="";for(const r of rows)yerelUygula(r.koleksiyon,r.id,r.veri)}
function sbHata(e){const m=e.message||"";const x=new Error(m);x.code=/rate|too many|429/i.test(m)?"resource_exhausted":/fetch|network|Failed/i.test(m)?"unavailable":"invalid_argument";return x}
let _yenileZ=null;function veriYenile(){clearTimeout(_yenileZ);_yenileZ=setTimeout(async()=>{try{await tumunuYukle();render()}catch(e){}},800)}
async function veriBaslat(){
  state.mode="loading";state.error="";render();
  try{await tumunuYukle();state.mode="db"}catch(e){state.mode="db";state.error="Kayıtlar yüklenemedi. "+sbMesaj(e)}
  if(kanal)sb.removeChannel(kanal);
  kanal=sb.channel("kayitlar-"+firmaId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"kayitlar",filter:"firma_id=eq."+firmaId},p=>{yerelUygula(p.new.koleksiyon,p.new.id,p.new.veri);renderSonra()})
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"kayitlar",filter:"firma_id=eq."+firmaId},p=>{yerelUygula(p.new.koleksiyon,p.new.id,p.new.veri);renderSonra()})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"kayitlar"},p=>{const o=p.old||{};if(o.firma_id===firmaId&&o.koleksiyon){yerelUygula(o.koleksiyon,o.id,null);renderSonra()}})
    .subscribe();
  api={newId:()=>idUret(),
    setDoc:async(col,id,obj)=>{yerelUygula(col,id,obj);renderSonra();const {error}=await sb.from("kayitlar").upsert({firma_id:firmaId,koleksiyon:col,id,veri:obj,guncelleme:new Date().toISOString()});if(error){veriYenile();throw sbHata(error)}},
    del:async(col,id)=>{yerelUygula(col,id,null);renderSonra();const {error}=await sb.from("kayitlar").delete().match({firma_id:firmaId,koleksiyon:col,id});if(error){veriYenile();throw sbHata(error)}},
    setFirma:async n=>{yerelUygula("ayar","firma",{ad:n});render();const {error}=await sb.from("kayitlar").upsert({firma_id:firmaId,koleksiyon:"ayar",id:"firma",veri:{ad:n}});if(error)throw sbHata(error);if(firmaRol==="sahip")await sb.from("firmalar").update({ad:n}).eq("id",firmaId)}};
  render();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&firmaId)veriYenile()});
}
/* Yedek */
async function yedekAl(){const k={};let n=0;for(const [c,sk] of Object.entries(KOLEKSIYONLAR)){k[c]=state[sk]||[];n+=k[c].length}
  const data={uygulama:"arvenato-on-muhasebe",surum:1,tarih:new Date().toISOString(),firma:state.firma,koleksiyonlar:k};
  const ok=await dosyaKaydet("on-muhasebe-yedek-"+today()+".json",new Blob([JSON.stringify(data)],{type:"application/json"}));if(ok)toast("Yedek indirildi: "+n.toLocaleString("tr-TR")+" kayıt")}
function yedekYukleModal(){
  let veri=null;
  openModal(`<div class="section-head"><h2>Yedekten geri yükle</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    <div class="muted" style="font-size:.88rem">Eski programdaki <b>Yedek al</b> düğmesiyle indirdiğiniz .json dosyasını seçin. Kayıtlar bu firmaya eklenir; aynı kimlikteki kayıtlar yedektekiyle güncellenir, diğer kayıtlarınız silinmez.</div>
    <div class="field"><label for="yYDosya">Yedek dosyası (.json)</label><input id="yYDosya" type="file" accept=".json,application/json"></div>
    <div id="yYOzet"></div><div class="err" id="yYErr" role="alert"></div><div class="muted" id="yYDurum" role="status" style="font-size:.85rem"></div>
    <div class="modal-foot"><button type="button" data-m="close">Vazgeç</button><button type="button" class="primary" data-m="yukle" id="yYBtn" hidden>Geri yükle</button></div>`,
  root=>{root.addEventListener("change",async e=>{if(e.target.id!=="yYDosya")return;const er=root.querySelector("#yYErr");er.textContent="";veri=null;root.querySelector("#yYBtn").hidden=true;
      try{const j=JSON.parse(await e.target.files[0].text());if(!j||!j.koleksiyonlar)throw new Error();veri=j;
        const say=Object.entries(KOLEKSIYONLAR).map(([c])=>[c,(j.koleksiyonlar[c]||[]).length]).filter(x=>x[1]);const top=say.reduce((s,x)=>s+x[1],0);
        const ad={cariler:"Cariler",hareketler:"Hareketler",personeller:"Personeller",personelEk:"Mesai / prim / ürün",izinler:"İzinler",bankalar:"Bankalar",virmanlar:"Virmanlar",urunler:"Ürünler",stokHareketleri:"Stok hareketleri",teklifler:"Teklifler",faturalar:"Faturalar",ajanda:"Ajanda"};
        root.querySelector("#yYOzet").innerHTML=`<div class="panel" style="padding:12px;gap:6px"><b>${esc(j.firma||"")}</b><div class="muted" style="font-size:.82rem">Yedek tarihi: ${j.tarih?trDate(j.tarih.slice(0,10)):"—"} · toplam ${top.toLocaleString("tr-TR")} kayıt</div><div style="display:flex;flex-wrap:wrap;gap:6px">${say.map(([c,n])=>`<span class="chip">${ad[c]||c}: ${n.toLocaleString("tr-TR")}</span>`).join("")}</div></div>`;
        root.querySelector("#yYBtn").hidden=!top}catch(err){er.textContent="Bu dosya geçerli bir yedek değil."}});
    root.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;if(b.dataset.m==="close")return closeModal();if(b.dataset.m!=="yukle"||!veri)return;
      const du=root.querySelector("#yYDurum"),er=root.querySelector("#yYErr");root.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      const rows=[];for(const c of Object.keys(KOLEKSIYONLAR))for(const d of (veri.koleksiyonlar[c]||[])){if(!d||!d.id)continue;const {id,...rest}=d;rows.push({firma_id:firmaId,koleksiyon:c,id:String(id),veri:rest})}
      if(veri.firma&&!state.firma)rows.push({firma_id:firmaId,koleksiyon:"ayar",id:"firma",veri:{ad:veri.firma}});
      let n=0;try{for(let i=0;i<rows.length;i+=500){const parca=rows.slice(i,i+500);let dene=0;for(;;){const {error}=await sb.from("kayitlar").upsert(parca);if(!error)break;if(++dene>3)throw error;await new Promise(r=>setTimeout(r,1500*dene))}n+=parca.length;du.textContent=`Yükleniyor… ${n.toLocaleString("tr-TR")} / ${rows.length.toLocaleString("tr-TR")}`}
        await tumunuYukle();render();closeModal();toast(rows.length.toLocaleString("tr-TR")+" kayıt geri yüklendi")}
      catch(err){er.textContent=sbMesaj(err)+" ("+n+" kayıt yüklendi; tekrar deneyebilirsiniz)";root.querySelectorAll("button,input").forEach(x=>x.disabled=false)}});
  });
}
/* Hesap ve kullanıcılar */
function hesapModal(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;const kurulu=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  openModal(`<div class="section-head"><h2>Hesabım</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    <div class="panel" style="padding:12px;gap:4px"><b>${esc(oturum.user.email)}</b><div class="muted" style="font-size:.85rem">${esc(state.firma||"")} · ${firmaRol==="sahip"?"Firma sahibi":"Kullanıcı"}</div></div>
    ${kurulu?"":kurulumOlayi?`<button type="button" class="primary" data-m="kur" style="text-align:left;padding:12px 14px">Uygulamayı bu cihaza yükle<div style="font-weight:400;font-size:.8rem;opacity:.85">Masaüstüne / ana ekrana simgesiyle eklenir</div></button>`:`<div class="notice" style="font-size:.85rem"><b>Uygulama olarak yüklemek için:</b> ${ios?"Safari'de Paylaş düğmesine dokunup <b>Ana Ekrana Ekle</b>'yi seçin.":"Chrome'da adres çubuğunun sağındaki yükle simgesine ya da menüden <b>Uygulamayı yükle</b>'ye tıklayın. Android'de menüden <b>Ana ekrana ekle</b>."}</div>`}
    <div style="display:grid;gap:8px">
      ${firmaRol==="sahip"?`<button type="button" data-m="kullanicilar" style="text-align:left;padding:10px 14px">Kullanıcılar<div class="muted" style="font-weight:400;font-size:.8rem">Çalışanlarınıza erişim verin</div></button>`:""}
      <button type="button" data-m="yedek" style="text-align:left;padding:10px 14px">Yedek al<div class="muted" style="font-weight:400;font-size:.8rem">Tüm kayıtları .json dosyası olarak indir</div></button>
      <button type="button" data-m="geri" style="text-align:left;padding:10px 14px">Yedekten geri yükle<div class="muted" style="font-weight:400;font-size:.8rem">Eski programdan aldığınız yedeği buraya aktarın</div></button>
      <button type="button" data-m="sifre" style="text-align:left;padding:10px 14px">Şifremi değiştir</button>
      <button type="button" class="danger" data-m="cikis" style="text-align:left;padding:10px 14px">Çıkış yap</button>
    </div>`,
  root=>root.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=b.dataset.m;
    if(m==="close")return closeModal();
    if(m==="kur"&&kurulumOlayi){kurulumOlayi.prompt();try{await kurulumOlayi.userChoice}catch(err){}kurulumOlayi=null;closeModal();return}
    if(m==="kullanicilar"){closeModal();return kullanicilarModal()}
    if(m==="yedek"){closeModal();return yedekAl()}
    if(m==="geri"){closeModal();return yedekYukleModal()}
    if(m==="sifre"){closeModal();return sifreYenileEkrani()}
    if(m==="cikis"){closeModal();return cikisYap()}}));
}
async function kullanicilarModal(){
  const liste=async root=>{const k=root.querySelector("#kuListe");k.innerHTML=`<div class="muted">Yükleniyor…</div>`;const {data,error}=await sb.rpc("uyeleri_listele",{p_firma:firmaId});
    if(error){k.innerHTML=`<div class="err">${esc(sbMesaj(error))}</div>`;return}
    k.innerHTML=`<div class="tscroll"><table><thead><tr><th>E-posta</th><th>Rol</th><th></th></tr></thead><tbody>${data.map(u=>`<tr><td>${esc(u.eposta)}</td><td>${u.rol==="sahip"?"Sahip":"Kullanıcı"}</td><td>${u.rol!=="sahip"?`<button class="small ghost danger" data-m="cikar" data-u="${u.user_id}" type="button">Çıkar</button>`:""}</td></tr>`).join("")}</tbody></table></div>`};
  openModal(`<div class="section-head"><h2>Kullanıcılar</h2><button class="ghost small" data-m="close" type="button">Kapat</button></div>
    <div class="muted" style="font-size:.88rem">Çalışanınız önce uygulamada <b>Hesap oluştur</b> ile kendi e-postası ve şifresiyle kaydolmalı. Sonra e-postasını buraya yazıp ekleyin; tüm kayıtları görüp düzenleyebilir.</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><input id="kuEposta" type="email" placeholder="calisan@ornek.com" style="flex:1;min-width:200px"><button type="button" class="primary small" data-m="ekle">Ekle</button></div>
    <div class="err" id="kuErr" role="alert"></div><div id="kuListe"></div>`,
  root=>{liste(root);root.addEventListener("click",async e=>{const b=e.target.closest("[data-m]");if(!b)return;const er=root.querySelector("#kuErr");er.textContent="";
    if(b.dataset.m==="close")return closeModal();
    if(b.dataset.m==="ekle"){const ep=root.querySelector("#kuEposta").value.trim();if(!ep){er.textContent="E-posta yazın.";return}b.disabled=true;const {error}=await sb.rpc("uye_ekle",{p_firma:firmaId,p_eposta:ep});b.disabled=false;if(error){er.textContent=sbMesaj(error);return}root.querySelector("#kuEposta").value="";toast("Kullanıcı eklendi");liste(root);return}
    if(b.dataset.m==="cikar"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Onayla";return}const {error}=await sb.rpc("uye_cikar",{p_firma:firmaId,p_user:b.dataset.u});if(error){er.textContent=sbMesaj(error);return}toast("Kullanıcı çıkarıldı");liste(root)}})});
}
async function uygulamaBaslat(){
  if(!CFG.supabaseUrl||!CFG.supabaseKey){kapiGoster(`<h2>Kurulum tamamlanmamış</h2><div class="muted">config.js dosyasına Supabase bağlantı bilgilerini girin.</div>`);return}
  if(!window.supabase){kapiGoster(`<h2>Bağlantı kurulamadı</h2><div class="muted">Uygulama dosyaları yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div><button class="primary" type="button" onclick="location.reload()">Yenile</button>`);return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let kurtarma=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY"){kurtarma=true;oturum=s;sifreYenileEkrani()}else if(ev==="SIGNED_OUT"){oturum=null}else if(s)oturum=s});
  const {data:{session}}=await sb.auth.getSession();oturum=session;
  if(kurtarma&&oturum)return sifreYenileEkrani();
  if(!oturum)return girisEkrani();
  await firmaSec();
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();kurulumOlayi=e});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("hesapBtn").addEventListener("click",()=>{if(oturum)hesapModal()});
document.getElementById("yedekBtn").remove();

setView();
uygulamaBaslat();
})();
</script>
</body>
</html>
